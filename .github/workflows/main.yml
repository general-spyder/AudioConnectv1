name: Build AudioConnect (Windows)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Locate CMake project
        id: project
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path . -Filter CMakeLists.txt -File -Recurse | Where-Object { $_.FullName -notmatch '[\\/](build|_deps|node_modules)[\\/]' })
          if ($files.Count -eq 0) { throw 'No CMakeLists.txt found. Confirm the CMake project files are committed to GitHub.' }
          if ($files.Count -gt 1) {
            Write-Host 'Multiple CMake projects found:'
            $files | ForEach-Object { Write-Host $_.FullName }
            throw 'Select the intended source directory explicitly in this workflow.'
          }
          $source = $files[0].Directory.FullName
          Write-Host "CMake source: $source"
          "source=$source" >> $env:GITHUB_OUTPUT

      - name: Configure with Visual Studio 2022
        shell: pwsh
        run: |
          cmake -S '${{ steps.project.outputs.source }}' -B build -G 'Visual Studio 17 2022' -A x64

      - name: Build Release
        shell: pwsh
        run: cmake --build build --config Release --parallel 2

      - name: Collect Windows outputs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $exeDir = Join-Path (Resolve-Path artifacts).Path 'Standalone'
          $vstDir = Join-Path (Resolve-Path artifacts).Path 'VST3'
          New-Item -ItemType Directory -Force -Path $exeDir, $vstDir | Out-Null
          $files = @(Get-ChildItem build -Recurse -File -Filter *.exe | Where-Object { $_.FullName -match '[\\/]Release[\\/]' -and $_.FullName -notmatch '[\\/]CMakeFiles[\\/]' })
          $bundles = @(Get-ChildItem build -Recurse -Directory -Filter *.vst3 | Where-Object { $_.FullName -match '[\\/]Release[\\/]' })
          $plugins = @(Get-ChildItem build -Recurse -File -Filter *.vst3 | Where-Object { $_.FullName -match '[\\/]Release[\\/]' })
          foreach ($file in $files) { Copy-Item -LiteralPath $file.FullName -Destination $exeDir -Force }
          foreach ($bundle in $bundles) { Copy-Item -LiteralPath $bundle.FullName -Destination (Join-Path $vstDir $bundle.Name) -Recurse -Force }
          foreach ($plugin in $plugins) { Copy-Item -LiteralPath $plugin.FullName -Destination $vstDir -Force }
          Write-Host 'Collected outputs:'
          Get-ChildItem artifacts -Recurse | Select-Object FullName
          if ($files.Count -eq 0 -and $bundles.Count -eq 0 -and $plugins.Count -eq 0) { throw 'No standalone EXE or VST3 outputs found in the Release build.' }

      - name: Upload Windows builds
        uses: actions/upload-artifact@v4
        with:
          name: AudioConnect-Windows
          path: artifacts/
          if-no-files-found: error
